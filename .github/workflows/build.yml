# Rebuilds the site several times a day so the Mt Fuji forecast and "next release" dates stay current.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. The Pages project is created on the first deploy.
name: build-and-deploy
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run fetch:jma || echo "JMA fetch failed; building without forecast"
      - run: npm run build
      - name: Create the Cloudflare Pages project on first deploy
        if: ${{ github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          npx wrangler@3 pages project list | grep -q ' japan-ticket-clock ' \
            || npx wrangler@3 pages project create japan-ticket-clock --production-branch=main
      - name: Deploy to Cloudflare Pages
        if: ${{ github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler@3 pages deploy dist --project-name=japan-ticket-clock --branch=main
